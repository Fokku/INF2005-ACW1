[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acw1-stego"
version = "0.1.0"
description = "INF2005 ACW1 — LSB steganography with hashing and digital-signature verification"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.3",
    "pillow==12.3.0",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.6"]

[project.scripts]
stego = "stego_core.cli:main"

[tool.setuptools]
packages = ["stego_core", "app", "app.routers"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# B008 flags `File(...)` / `Form(...)` in argument defaults, which is exactly how
# FastAPI declares uploads and form fields. Not a bug here.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
